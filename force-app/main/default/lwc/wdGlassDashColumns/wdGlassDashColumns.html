<template>
    <section class="wd-glass panel">
        <header class="panel-head">
            <div>
                <h2 class="wd-section-title">{heading}</h2>
                <p class="panel-kicker">{kicker}</p>
            </div>
            <template lwc:if={showTarget}>
                <ul class="legend">
                    <li><span class={swatchClass}></span>{valueLabel}</li>
                    <li><span class="swatch swatch_target"></span>Target</li>
                </ul>
            </template>
        </header>
        <template lwc:if={hasData}>
            <div class="chart" role="img" aria-label={ariaLabel}>
                <div class="axis">
                    <template for:each={ticks} for:item="t">
                        <span key={t.key} class="tick num" style={t.style}>{t.label}</span>
                    </template>
                </div>
                <div class="plot">
                    <template for:each={ticks} for:item="t">
                        <span key={t.key} class="grid" style={t.style}></span>
                    </template>
                    <template for:each={groups} for:item="g">
                        <div key={g.key} class={g.groupClass} tabindex="0" data-index={g.index}
                            onmouseenter={handleEnter} onfocus={handleEnter} onmouseleave={handleLeave} onblur={handleLeave}>
                            <div class="bars">
                                <span class={g.barClass} style={g.barStyle}></span>
                                <template lwc:if={g.hasTarget}>
                                    <span class="target" style={g.targetStyle}></span>
                                </template>
                            </div>
                            <span class="month">{g.label}</span>
                        </div>
                    </template>
                </div>
            </div>
        </template>
        <template lwc:else>
            <p class="empty">{emptyText}</p>
        </template>
    </section>
</template>
