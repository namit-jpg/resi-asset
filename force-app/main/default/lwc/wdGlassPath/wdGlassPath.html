<template>
    <template lwc:if={hasSteps}>
        <div class="path-container">
            <template lwc:if={isOffPathLead}>
                <div class="offpath-banner">
                    <div class="offpath-tag">
                        <span class="offpath-dot" aria-hidden="true"></span>
                        <span class="offpath-title">{offPathStatusTitle}</span>
                    </div>
                    <span class="offpath-desc">{offPathStatusDesc}</span>
                </div>
            </template>
            <section class="wd-glass path" aria-label="Status path">
                <ol class="steps">
                    <template for:each={steps} for:item="step">
                        <li key={step.key} class="step-wrap">
                            <button
                                type="button"
                                class={step.className}
                                data-value={step.value}
                                aria-current={step.ariaCurrent}
                                title={step.label}
                                onclick={handleSelect}
                            >
                                <template lwc:if={step.isDone}>
                                    <span class="check" aria-hidden="true"></span>
                                </template>
                                <span class="step-label">{step.label}</span>
                            </button>
                        </li>
                    </template>
                </ol>
                <button type="button" class="wd-btn wd-btn_primary mark" disabled={buttonDisabled} onclick={handleMark}>
                    {buttonLabel}
                </button>
            </section>
        </div>
    </template>
</template>
